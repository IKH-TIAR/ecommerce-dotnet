name: Ecommerce CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: [self-hosted, Linux, X64]

    env:
      HARBOR_REGISTRY: harbor.athlongoapp.com
      HARBOR_PROJECT: athlongo
      IMAGE_NAME: ecommerce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build information
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          docker --version

      - name: Generate image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Image tag: $IMAGE_TAG"

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
          docker login "$HARBOR_REGISTRY" \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --provenance=false \
            --sbom=false \
            -t "$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Push image to Harbor
        run: |
          docker push \
            "$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG"

      - name: Show pushed image
        run: |
          echo "Image successfully pushed:"
          echo "$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG"

      - name: Logout from Harbor
        if: always()
        run: |
          docker logout "$HARBOR_REGISTRY" || true
